name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Advisories are published against dependencies we did not touch, so a
  # push-only trigger would never fire for them. Both quick-xml advisories
  # affecting this workspace landed with no change on our side.
  schedule:
    - cron: "17 6 * * *"

# Fork pull requests already run without secrets and with a read-only token.
# State the token scope explicitly so it does not depend on the repository
# default, and cap runtime so a hung or abusive job cannot burn the 6h default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --workspace --exclude dpp-python

  test-features:
    name: Test (parallel feature)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p pbzx --features parallel
      - run: cargo test --locked -p dpp --features parallel

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Yanked releases are not advisories, so the action above ignores them.
      # pyo3 0.28.1 was yanked and sat pinned in an uncommitted lock with
      # nothing to notice, which is the case this catches.
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny yanked

  # The committed Cargo.lock says what we build; this says what a fresh
  # consumer of the published crates would resolve. Five of the eight crates
  # are libraries, whose users never see our lockfile, so both matter.
  audit-fresh:
    name: Security advisories (latest deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - run: cargo install cargo-audit --locked
      - run: cargo update
      - run: cargo audit

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and a current release. The
        # floor is what actually breaks; pyo3 and typing changes land there
        # first.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tooling
        run: python -m pip install --upgrade pip maturin pytest

      # A debug wheel is enough to exercise the bindings and is far quicker
      # than --release. The publish workflow is what builds release wheels.
      - name: Build the extension module
        run: maturin build --out dist --manifest-path dpp-python/Cargo.toml

      - name: Install the built wheel
        run: pip install --no-index --find-links dist dpp-py

      - name: Run the Python test suite
        run: pytest dpp-python/tests -v

      # dpp-python is excluded from the workspace doc job because that job has
      # no Python headers. It has them here, so the exclusion can be closed.
      - name: Documentation
        run: cargo doc -p dpp-python --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --locked --workspace --no-deps --exclude dpp-python
        env:
          RUSTDOCFLAGS: -D warnings
