name: Unused dependencies

# Deliberately a separate pipeline from ci.yml. cargo-machete is a third-party
# binary we install from crates.io at job time, so it runs with no credentials
# and no cache that another job could consume: an unused-dependency report is
# never worth widening the blast radius of a supply-chain compromise.
#
# Pull-request only. Unlike the advisory scans in ci.yml, an unused dependency
# cannot appear without someone editing a Cargo.toml, so there is nothing for a
# scheduled run to discover.
on:
  pull_request:
    branches: [main, dev]

# No scopes at all. The job reads the checked-out tree and nothing else.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the token off the runner disk; nothing here talks to git again.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo machete
