[package]
name = "dpp-python"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Python bindings for the dpp Apple disk image and package toolkit"

[lib]
name = "dpp"
crate-type = ["cdylib"]

[dependencies]
dpp = { version = "0.4.1", path = "../dpp", features = ["parallel"] }
pyo3 = { version = "0.28.1", features = ["extension-module"] }
