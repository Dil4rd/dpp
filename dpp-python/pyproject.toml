[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dpp-py"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Python bindings for parsing Apple DMG disk images, HFS+/APFS filesystems, PKG installers, and PBZX/CPIO payloads"
readme = "README.md"
license = "MIT"
# The wheels statically link their Rust dependencies, whose licences require
# their texts and copyright notices to travel with the binary.
# THIRD-PARTY-LICENSES.md is generated; see about.toml.
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "dpp._dpp"
