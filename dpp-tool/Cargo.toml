[package]
name = "dpp-tool"
version = "0.5.4"
edition = "2024"
description = "CLI to explore Apple DMG disk images: DMG → HFS+/APFS → PKG → PBZX → files"
license = "MIT"
repository = "https://github.com/Dil4rd/dpp"

[[bin]]
name = "dpp-tool"
path = "src/main.rs"

[dependencies]
dpp = { version = "0.5.0", path = "../dpp" }
udif = { version = "0.4.0", path = "../udif" }
hfsplus = { version = "0.3.0", path = "../hfsplus" }
apfs = { version = "0.3.0", path = "../apfs" }
xara = { version = "0.4.0", path = "../xara" }
pbzx = { version = "0.4.0", path = "../pbzx" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[features]
default = ["parallel"]
parallel = ["dpp/parallel"]
