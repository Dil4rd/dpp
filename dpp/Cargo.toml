[package]
name = "dpp"
version = "0.4.1"
edition = "2024"
description = "DMG + HFS+/APFS + PKG + PBZX pipeline - walk through Apple disk images to extract packages"
license = "MIT"
repository = "https://github.com/Dil4rd/dpp"
keywords = ["dmg", "apple", "macos", "pkg", "filesystem"]
categories = ["compression", "encoding", "parsing"]

[dependencies]
udif = { version = "0.3.3", path = "../udif" }
pbzx = { version = "0.3.0", path = "../pbzx" }
hfsplus = { version = "0.2.3", path = "../hfsplus" }
apfs = { version = "0.2.3", path = "../apfs" }
xara = { version = "0.3.1", path = "../xara" }
thiserror = "2"
tempfile = "3"

[dev-dependencies]
flate2 = "1.0"
hfsplus = { path = "../hfsplus", features = ["testutil"] }

[features]
default = ["extract"]
extract = []
parallel = ["pbzx/parallel", "udif/parallel"]
